# Workflow Status Template

# This tracks progress through BMM methodology Analysis, Planning, and Solutioning phases.
# Implementation phase is tracked separately in sprint-status.yaml

# STATUS DEFINITIONS:
# ==================
# Initial Status (before completion):
#   - required: Must be completed to progress
#   - optional: Can be completed but not required
#   - recommended: Strongly suggested but not required
#   - conditional: Required only if certain conditions met (e.g., if_has_ui)
#
# Completion Status:
#   - {file-path}: File created/found (e.g., "docs/product-brief.md")
#   - skipped: Optional/conditional workflow that was skipped

generated: "2026-01-17"
project: "mbu"
project_type: "content-platform-expansion"
selected_track: "bmad-method"
field_type: "greenfield"
workflow_path: "method-greenfield"

# User selections for discovery phase
discovery_workflows:
  brainstorm: true
  research: true
  product_brief: true

workflow_status:
  # Phase 1: Analysis (Optional - User Selected All Three)
  - phase: 1
    name: "Analysis"
    workflows:
      - id: "brainstorm-project"
        name: "Project Brainstorming"
        status: "optional"
        agent: "analyst"
        command: "/bmad:bmm:workflows:brainstorming"
        note: "Creative exploration and ideation for content strategy"

      - id: "research"
        name: "Research"
        status: "optional"
        agent: "analyst"
        command: "/bmad:bmm:workflows:research"
        note: "Competitive analysis, SEO research, content patterns"

      - id: "product-brief"
        name: "Product Brief"
        status: "optional"
        agent: "analyst"
        command: "/bmad:bmm:workflows:create-product-brief"
        note: "Strategic product planning - recommended for greenfield"

  # Phase 2: Planning
  - phase: 2
    name: "Planning"
    workflows:
      - id: "prd"
        name: "Product Requirements Document"
        status: "required"
        agent: "pm"
        command: "/bmad:bmm:workflows:prd"
        note: "Complete PRD with functional and non-functional requirements"

      - id: "create-ux-design"
        name: "UX Design"
        status: "conditional"
        agent: "ux-designer"
        command: "/bmad:bmm:workflows:create-ux-design"
        note: "UI/UX patterns - determined after PRD if UI changes needed"

  # Phase 3: Solutioning
  - phase: 3
    name: "Solutioning"
    workflows:
      - id: "create-architecture"
        name: "Architecture"
        status: "required"
        agent: "architect"
        command: "/bmad:bmm:workflows:create-architecture"
        note: "System architecture and technical decisions"

      - id: "create-epics-and-stories"
        name: "Epics & Stories"
        status: "required"
        agent: "pm"
        command: "/bmad:bmm:workflows:create-epics-and-stories"
        note: "Break down PRD into implementable units"

      - id: "test-design"
        name: "Test Design"
        status: "optional"
        agent: "tea"
        command: "/bmad:bmm:workflows:test-design"
        note: "System-level testability assessment"

      - id: "implementation-readiness"
        name: "Implementation Readiness Check"
        status: "required"
        agent: "architect"
        command: "/bmad:bmm:workflows:check-implementation-readiness"
        note: "Validates all planning artifacts before implementation"

  # Phase 4: Implementation
  - phase: 4
    name: "Implementation"
    workflows:
      - id: "sprint-planning"
        name: "Sprint Planning"
        status: "required"
        agent: "sm"
        command: "/bmad:bmm:workflows:sprint-planning"
        note: "Creates sprint-status.yaml for iterative implementation tracking"
