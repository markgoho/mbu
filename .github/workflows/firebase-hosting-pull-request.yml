# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on:
  # The Hugo site build reads none of app/, api/, terraform/ or the other
  # workflows. A later pattern overrides an earlier one, so a change to this
  # file still runs the preview. Not a required check, so a `paths` filter
  # is safe.
  pull_request:
    paths:
      - "**"
      - "!app/**"
      - "!api/**"
      - "!terraform/**"
      - "!.github/workflows/**"
      - ".github/workflows/firebase-hosting-pull-request.yml"
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:trunk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
      - name: Install dependencies
        run: bun install
      - name: Build Hugo site and search index
        run: bun run build
      - uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MERIT_BADGE_UNIVERSITY }}
          projectId: merit-badge-university
          target: main-site
          expires: 1d
