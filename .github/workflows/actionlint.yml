name: Lint workflows

# Checks every workflow file with actionlint (and shellcheck on each `run:`
# block) when a workflow changes (#245).
on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches:
      - trunk
    paths:
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.0

      # Retried with a 10s gap: the download script asks GitHub's API for
      # the release asset, which sometimes answers 429 to shared runners.
      # The script is saved to a file first, so a failed download is a
      # failed attempt and not an empty script that exits 0.
      - name: Install actionlint
        run: |
          for attempt in 1 2 3; do
            if curl -fsSL -o download-actionlint.bash https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash \
              && bash download-actionlint.bash 1.7.12; then
              exit 0
            fi
            echo "actionlint install attempt ${attempt} failed; retrying in 10s..."
            sleep 10
          done
          exit 1

      - name: Lint workflows
        run: ./actionlint
