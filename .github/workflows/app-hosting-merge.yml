name: Deploy App site to Firebase Hosting on merge

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - trunk
    paths:
      - "app/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/app-hosting-merge.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:trunk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
      - name: Install dependencies
        working-directory: app
        run: bun install
      - name: Type-check App site
        working-directory: app
        run: bun run check
      - name: Lint App site
        working-directory: app
        run: bun run lint

  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:trunk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
      - name: Install dependencies
        working-directory: app
        run: bun install
      - name: Test App site
        working-directory: app
        run: bun run test:unit

  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:trunk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
      - name: Install dependencies
        working-directory: app
        run: bun install
      - name: Build App site
        working-directory: app
        run: bun run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: app-build
          path: app/build
          retention-days: 1

  # Disabled until #238 ports the Playwright suite to the SvelteKit app. To
  # enable it again, remove `if: false` and add `e2e` to the `needs` of the
  # deploy job.
  e2e:
    if: false
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:trunk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
      - name: Install root dependencies
        run: bun install
      - name: Install functions dependencies
        working-directory: functions
        run: npm install
      - name: Install app dependencies
        working-directory: app
        run: bun install
      - name: Run E2E tests
        working-directory: app
        run: bun run test:e2e
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7

  deploy:
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: app-build
          path: app/build
      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MERIT_BADGE_UNIVERSITY }}
          channelId: live
          projectId: merit-badge-university
          target: app-site
