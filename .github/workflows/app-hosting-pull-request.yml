name: Deploy App site to Firebase Hosting on PR

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "app/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/app-hosting-pull-request.yml"

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  lint:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:trunk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install dependencies
        working-directory: app
        run: bun install
      - name: Lint App site
        working-directory: app
        run: bun run lint

  test:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:trunk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install dependencies
        working-directory: app
        run: bun install
      - name: Test App site
        working-directory: app
        run: bun run test

  build:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:trunk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install dependencies
        working-directory: app
        run: bun install
      - name: Build App site
        working-directory: app
        run: bun run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: app-build
          path: app/dist/app/browser
          retention-days: 1

  e2e:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:trunk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install root dependencies
        run: bun install
      - name: Install functions dependencies
        working-directory: functions
        run: npm install
      - name: Install app dependencies
        working-directory: app
        run: bun install
      - name: Lint E2E tests
        working-directory: app
        run: bun run lint:e2e
      - name: Typecheck E2E tests
        working-directory: app
        run: bun run typecheck:e2e
      - name: Run E2E tests
        working-directory: app
        run: bun run e2e
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7

  preview:
    needs: [lint, test, build, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: app-build
          path: app/dist/app/browser
      - name: Deploy to Firebase preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MERIT_BADGE_UNIVERSITY }}
          projectId: merit-badge-university
          target: app-site
