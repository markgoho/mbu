name: Check GCP deploy identity

# Manual check that GitHub Actions can authenticate as mbu-deploy@ through
# Workload Identity and read the `api` Artifact Registry repository (#258).
# Run it from trunk after the Terraform apply in api/docs/infrastructure.md.
# From another branch the exchange is refused: the binding of mbu-deploy@
# accepts refs/heads/trunk only (#260).
# The deploy pipeline (#260) uses the same provider and service account.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: google-github-actions/auth@v3.0.0
        with:
          project_id: merit-badge-university
          workload_identity_provider: projects/643912800060/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: mbu-deploy@merit-badge-university.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3.0.1

      - name: List the api repository
        run: |
          gcloud artifacts repositories describe api \
            --project merit-badge-university --location us-east4
          gcloud artifacts docker images list \
            us-east4-docker.pkg.dev/merit-badge-university/api
