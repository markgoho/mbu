name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - trunk
    paths-ignore:
      - "Dockerfile"
      - ".github/workflows/docker-image.yml"
      - "app/**"
      - "functions/**"
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:trunk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 2
      - name: Install dependencies
        run: bun install
      - name: Build Hugo site and search index
        run: bun run build
      - uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MERIT_BADGE_UNIVERSITY }}
          channelId: live
          projectId: merit-badge-university
          target: main-site
