version: "2"

run:
  timeout: 5m

linters:
  # Start from the small default set (errcheck, govet, ineffassign,
  # staticcheck, unused) and add linters that catch real bugs, unhandled
  # errors, or missing documentation. Deliberately skip the purely
  # aesthetic linters (wsl, nlreturn, varnamelen, exhaustruct, ...) and the
  # ones that fight idioms already used throughout this codebase
  # (noinlineerr bans `if err := f(); err != nil {...}`; nonamedreturns
  # bans deliberate named returns; err113 demands every error be a
  # pre-declared sentinel, even one-off messages in a dev tool).
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - durationcheck
    - errname
    - errorlint
    - exhaustive
    - forbidigo
    - godot
    - goconst
    - gocritic
    - gosec
    - intrange
    - misspell
    - modernize
    - nilerr
    - nilnil
    - noctx
    - predeclared
    - revive
    - rowserrcheck
    - sqlclosecheck
    - testifylint
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace
    - wrapcheck
  settings:
    # #240 decision 9: time is read through the clock seam. Production
    # code reads clock.Now(ctx) or an injected clock.Clock (Deps.Now)
    # instead of calling time.Now() directly. A call site that must read
    # real wall time carries //nolint:forbidigo and an inline reason, the
    # same shape the coverage gate's own exceptions take.
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^time\.Now$'
          msg: "read time through the clock seam (api/internal/clock) instead of calling time.Now() directly -- see #240 decision 9"
  exclusions:
    rules:
      # Deferred Close()/Rollback() on response bodies, rows, and
      # read-only test transactions carry no actionable error in tests.
      - path: _test\.go
        linters:
          - errcheck
      # Every _test.go file is free to call time.Now() directly: the
      # clock-seam gate is about production Go only.
      - path: _test\.go
        linters:
          - forbidigo

# Report every finding, not the default first 50 per linter and first 3
# of a kind. A new Go version can turn on many modernize findings at
# once; uncapped, CI and a local run both show the whole list, not the
# first page of it.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
