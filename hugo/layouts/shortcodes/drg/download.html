{{ $isPrintable := eq (.Get "type") "printable" }}
{{ $url := .Get "url" }}
<a
  href="{{ $url }}"
  class="drg-download"
  {{ if not $isPrintable }}download{{ end }}{{ if $isPrintable }}
    target="_blank" rel="noopener"
  {{ end }}>
  {{ if $isPrintable }}
    <svg
      class="drg-download__icon"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      width="24"
      height="24"
      fill="currentColor">
      <path
        d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z" />
    </svg>
  {{ else }}
    <svg
      class="drg-download__icon"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      width="24"
      height="24"
      fill="currentColor">
      <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" />
    </svg>
  {{ end }}
  <span class="drg-download__title">{{ .Get "title" }}</span>
  {{ with .Get "description" }}
    <span class="drg-download__description">{{ . }}</span>
  {{ end }}
  <span class="drg-download__print-link">Resource: {{ .Get "title" }} — {{ $url }}</span>
</a>
