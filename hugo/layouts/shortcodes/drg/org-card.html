{{ $url := .Get "url" }}
<div class="drg-org-card">
  <a
    href="{{ $url }}"
    class="drg-org-card__name"
    target="_blank"
    rel="noopener noreferrer"
    >{{ .Get "name" }}</a
  >
  <p class="drg-org-card__description">
    {{ .Get "description" | markdownify }}
  </p>
  <p class="drg-org-card__print-link">Organization: {{ .Get "name" }} — {{ $url }}</p>
</div>
