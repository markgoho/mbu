<a
  href="{{ .Get "url" }}"
  class="drg-external-link"
  target="_blank"
  rel="noopener noreferrer">
  <svg
    class="drg-external-link__icon"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    width="24"
    height="24"
    fill="currentColor">
    <path
      d="M19 19H5V5h7V3H5a2 2 0 00-2 2v14a2 2 0 002 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z" />
  </svg>
  <span class="drg-external-link__title">{{ .Get "title" }}</span>
  {{ with .Get "description" }}
    <span class="drg-external-link__description">{{ . }}</span>
  {{ end }}
</a>
