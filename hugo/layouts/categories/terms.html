{{ define "html-class" }}theme-v2{{ end }}

{{ define "main" }}
  {{ partial "breadcrumb.html" . }}
  <div class="content-wrapper list-container">
    <header>
      <h1>{{ .Title }}</h1>
      <p>Browse merit badges by category.</p>
    </header>

    <ul>
      {{ range .Data.Terms.Alphabetical }}
        <li>
          <a href="{{ .Page.RelPermalink }}">{{ .Page.Title }}</a>
          ({{ .Count }})
        </li>
      {{ end }}
    </ul>
  </div>
{{ end }}
