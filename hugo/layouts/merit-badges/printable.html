{{ define "html-class" }}theme-v2{{ end }}

{{ define "main-class" }}req-page{{ end }}

{{ define "main" }}
  <article class="req-content">
    <header class="req-header">
      <h1 class="req-header__title">{{ .Title }}</h1>
      {{ with .Params.group_title }}
        <span class="req-header__group">{{ . }}</span>
      {{ end }}
    </header>

    <section class="req-worksheet">
      {{ .Content }}
    </section>
  </article>
{{ end }}
