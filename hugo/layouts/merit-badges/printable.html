{{ define "html-class" }}theme-v2{{ end }}

{{ define "main-class" }}drg-page{{ end }}

{{ define "main" }}
  <article class="drg-content">
    <header class="drg-header">
      <h1 class="drg-header__title">{{ .Title }}</h1>
      {{ with .Params.group_title }}
        <span class="drg-header__group">{{ . }}</span>
      {{ end }}
    </header>

    <section class="drg-worksheet">
      {{ .Content }}
    </section>
  </article>
{{ end }}
