[module]
[[module.mounts]]
source = "assets"
target = "assets"
[[module.mounts]]
source = "layouts"
target = "layouts"
[[module.mounts]]
source = "static"
target = "static"

# The `markdown` output format behind each page's `<link rel="alternate"
# type="text/markdown">` (uni-theme#37; see CONTRACT.md). Defined, never
# turned on: a consumer opts in per page kind with `outputs`. Hugo
# already ships the `text/markdown` media type (suffixes md/mdown/markdown),
# so it is not redefined here -- a narrower suffix list would change it.
[outputFormats.markdown]
mediaType = "text/markdown"
baseName = "index"
isPlainText = true
rel = "alternate"

# LLM discovery files on the home page (uni-theme#40; see CONTRACT.md).
# Defined, never turned on: a consumer adds "llms" / "llmsfull" to its
# home `outputs`. head/meta.html links llms.txt from the home page when
# the `llms` format is on. The full-text format is named `llmsfull`, not
# `llms-full`: Hugo does not resolve a hyphenated format name in a
# template file name (home.llms-full.txt also matched `robots`). Its
# base name keeps the /llms-full.txt URL.
[outputFormats.llms]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true
notAlternative = true

[outputFormats.llmsfull]
mediaType = "text/plain"
baseName = "llms-full"
isPlainText = true
notAlternative = true

# Agent discovery files (see CONTRACT.md `### Agent discovery files`).
# Defined, never turned on: a consumer adds "agentskills" and "ard" to
# its home `outputs`. Names have no hyphens, for the same template-name
# reason as `llmsfull`.
[outputFormats.agentskills]
mediaType = "application/json"
path = ".well-known/agent-skills"
baseName = "index"
isPlainText = true
notAlternative = true

[outputFormats.ard]
mediaType = "application/json"
path = ".well-known"
baseName = "ard"
isPlainText = true
notAlternative = true

# ARD's predecessor path. isitagentready.com still reads only this one.
[outputFormats.aicatalog]
mediaType = "application/json"
path = ".well-known"
baseName = "ai-catalog"
isPlainText = true
notAlternative = true
