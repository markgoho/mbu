<div class="req-table-scroll" tabindex="0" aria-label="Scrollable table">
  <table>
    {{- $headers := slice -}}
    {{- with .THead }}
      <thead>
        {{- range . }}
          <tr>
            {{- range . }}
              {{- $headers = $headers | append .Text -}}
              <th{{ with .Alignment }} style="text-align: {{ . }};"{{ end }}>{{- .Text -}}</th>
            {{- end }}
          </tr>
        {{- end }}
      </thead>
    {{- end }}
    <tbody>
      {{- range .TBody }}
        <tr>
          {{- range $i, $cell := . }}
            {{- $label := index $headers $i | default "" -}}
            <td{{ with $label }} data-label="{{ . }}"{{ end }}{{ with .Alignment }} style="text-align: {{ . }};"{{ end }}>{{- .Text -}}</td>
          {{- end }}
        </tr>
      {{- end }}
    </tbody>
  </table>
</div>
