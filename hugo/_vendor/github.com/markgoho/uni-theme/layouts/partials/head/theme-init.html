<script>
  (function () {
    try {
      var stored = localStorage.getItem("theme");
      var isDark =
        stored === "dark" ||
        (stored !== "light" &&
          window.matchMedia("(prefers-color-scheme: dark)").matches);
      if (isDark) {
        document.documentElement.classList.add("dark");
      }
    } catch (e) {
      /* localStorage/matchMedia unavailable — fall back to light, no-op */
    }

    /* Assign view-transition-name to clicked badge links for smooth cross-document morphing */
    document.addEventListener(
      "pointerdown",
      function (e) {
        var a = e.target.closest && e.target.closest('a[href*="/merit-badges/"]');
        if (!a) return;
        var href = a.getAttribute("href") || "";
        var m = href.match(/\/merit-badges\/([a-z0-9-]+)\/?$/);
        if (
          m &&
          m[1] &&
          m[1] !== "eagle-required" &&
          m[1] !== "categories" &&
          m[1] !== "strategy"
        ) {
          a.style.viewTransitionName = "mb-title-" + m[1];
        }
      },
      { capture: true, passive: true }
    );
  })();
</script>
