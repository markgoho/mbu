{{/* The browser's own bars match the masthead (standard.css --mast).
  The media queries are the no-JS answer; the script below and
  theme-toggle.ts point both tags at the site's chosen theme instead. */}}
<meta name="theme-color" content="#263a20" media="(prefers-color-scheme: dark)" data-light="#45653a" data-dark="#263a20" />
<meta name="theme-color" content="#45653a" media="(prefers-color-scheme: light)" data-light="#45653a" data-dark="#263a20" />
<script>
  (function () {
    try {
      var stored = localStorage.getItem("theme");
      var isDark =
        stored === "dark" ||
        (stored !== "light" &&
          window.matchMedia("(prefers-color-scheme: dark)").matches);
      if (isDark) {
        document.documentElement.classList.add("dark");
      }
      document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
        m.content = isDark ? m.dataset.dark : m.dataset.light;
      });
    } catch (e) {
      /* localStorage/matchMedia unavailable — fall back to light, no-op */
    }

    /* Assign view-transition-name to clicked badge links for smooth cross-document morphing */
    document.addEventListener(
      "pointerdown",
      function (e) {
        var a = e.target.closest && e.target.closest('a[href*="/merit-badges/"]');
        if (!a) return;
        var href = a.getAttribute("href") || "";
        var m = href.match(/\/merit-badges\/([a-z0-9-]+)\/?$/);
        if (
          m &&
          m[1] &&
          m[1] !== "eagle-required" &&
          m[1] !== "categories" &&
          m[1] !== "strategy"
        ) {
          a.style.viewTransitionName = "mb-title-" + m[1];
        }
      },
      { capture: true, passive: true }
    );
  })();
</script>
