baseURL = 'https://merit-badge.university/'
locale = 'en-us'
title = 'Merit Badge University'

[module]
  [[module.imports]]
    path = "github.com/markgoho/uni-theme"

# Enable Git info for lastmod dates in sitemap
enableGitInfo = true

[sitemap]
  changefreq = ""  # Omit - Google ignores this
  priority = -1    # Omit priority tags - Google ignores this
  filename = "sitemap.xml"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[taxonomies]
  category = 'categories'

# robots, llms and llmsfull are uni-theme home templates (CONTRACT.md,
# "LLM discovery files"). Setting home replaces Hugo's default list, so
# html and rss stay in it.
[outputs]
  home = ['html', 'rss', 'robots', 'llms', 'llmsfull']

[params]
  mbu_base_url = 'https://merit-badge.university'
  scouting_u_base_url = 'https://scouting.university'

[params.llms]
  summary = 'Merit Badge University explains every Scouting America merit badge: the official requirements, synced from scouting.org, and a Digital Resource Guide for each badge.'

# drg/image resolves a guide image through ImageKit (uni-theme#39).
[params.drg.image]
  path = '/mbu-assets/merit-badges/%s/guide/%s'
  max_width = 800

[params.analytics]
  pirsch_code = 'nGgx7zltXKwcHRduBaMGOBWCO8L1lAjQ'
  clarity_id = 'xw9nckd7a6'

[params.theme]
  siteTitle = 'Merit Badge University'
  siteTitleShort = 'MBU'
  tagline = 'Your comprehensive resource for Scouting America merit badges.'

  [params.theme.cta]
    label = 'Browse Badges'
    href = '/merit-badges/'

  [[params.theme.footerColumns]]
    title = 'Merit Badges'
    [[params.theme.footerColumns.links]]
      label = 'All Badges'
      href = '/merit-badges/'

  [[params.theme.footerColumns]]
    title = 'Resources'
    [[params.theme.footerColumns.links]]
      label = 'Eagle Badge Strategy'
      href = '/merit-badges/eagle-required/strategy/'
    [[params.theme.footerColumns.links]]
      label = 'Eagle-Required List'
      href = '/merit-badges/eagle-required/'
    [[params.theme.footerColumns.links]]
      label = 'Requirements'
      href = '/search/'

[params.imagekit]
  # Plain default endpoint. A dedicated "mbu" URL-endpoint was tried but
  # rejected: ImageKit's router treats a leading /mbu/ path segment as an
  # endpoint switch even when addressed via the default endpoint, which
  # shadows any real folder also named /mbu/. See docs/adr for the ImageKit
  # migration decision record.
  endpoint = 'https://ik.imagekit.io/doulacoop'
  widths   = [400, 600, 800, 1200, 1600]
